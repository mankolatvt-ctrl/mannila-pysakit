<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Mannila 1 – Bussit</title>
<style type="text/css">
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #cfe8d6;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

    height: 1080px;
    background-color: #eaf6ee;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  header {
    height: 190px;
    background-color: #1e8e3e;
    color: #ffffff;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    padding: 0 64px;
  }
  .brand {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .bus-icon-wrap {
    width: 84px;
    height: 84px;
    margin-right: 28px;
    -webkit-box-flex: 0;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .brand-text h1 {
    margin: 0;
    font-size: 56px;
    font-weight: bold;
  }
  .brand-text p {
    margin: 4px 0 0 0;
    font-size: 22px;
    font-weight: normal;
    color: #d7f0dd;
  }
  .clock-block {
    text-align: right;
  }
  #clock {
    font-size: 60px;
    font-weight: bold;
    line-height: 1;
  }
  #date {
    margin-top: 6px;
    font-size: 20px;
    color: #d7f0dd;
  }
  main {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    padding: 36px 64px 24px 64px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    min-height: 0;
  }
  #list {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    min-height: 0;
  }
  .row {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    min-height: 0;
    margin-bottom: 16px;
    background-color: #ffffff;
    border-radius: 20px;
    padding: 0 40px;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  .row:last-child { margin-bottom: 0; }
  .badge {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background-color: #1e8e3e;
    color: #ffffff;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    margin-right: 30px;
    -webkit-box-flex: 0;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .row.soon .badge { background-color: #e2622a; }
  .dest {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    font-size: 40px;
    font-weight: bold;
    color: #1c2b22;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 20px;
  }
  .dest .sub {
    display: block;
    font-size: 20px;
    font-weight: normal;
    color: #6b7d72;
    margin-top: 4px;
  }
  .clocktime {
    width: 150px;
    text-align: right;
    font-size: 34px;
    color: #6b7d72;
    margin-right: 20px;
    -webkit-box-flex: 0;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .mins {
    width: 190px;
    text-align: center;
    background-color: #e6f4ea;
    color: #146c2e;
    border-radius: 16px;
    padding: 12px 10px;
    font-size: 40px;
    font-weight: bold;
    -webkit-box-flex: 0;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .mins .small {
    display: block;
    font-size: 16px;
    font-weight: normal;
    color: #1e8e3e;
    margin-top: 4px;
  }
  .row.soon .mins { background-color: #fbe6dc; color: #e2622a; }
  .row.soon .mins .small { color: #e2622a; }
  footer {
    height: 40px;
    text-align: center;
    color: #6b7d72;
    font-size: 16px;
    padding-top: 8px;
  }
  .msg {
    text-align: center;
    color: #6b7d72;
    font-size: 28px;
    padding: 40px 90px;
    line-height: 1.5;
  }
  .msg.err {
    color: #a8341b;
    font-weight: bold;
  }
  .msg .detail {
    display: block;
    margin-top: 16px;
    font-size: 18px;
    font-weight: normal;
    color: #6b7d72;
    font-family: "Courier New", monospace;
  }
  /* Pysyvä diagnostiikkarivi ruudun alalaidassa */
  #debugbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #12291a;
    color: #b7e4c7;
    font-family: "Courier New", monospace;
    font-size: 15px;
    padding: 6px 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #debugbar.err { background-color: #4a1710; color: #ffd0c4; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand">
      <div class="bus-icon-wrap">
        <svg width="84" height="84" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="10" width="56" height="34" rx="8" fill="#ffffff"></rect>
          <rect x="9" y="15" width="12" height="10" rx="2" fill="#1e8e3e"></rect>
          <rect x="24" y="15" width="12" height="10" rx="2" fill="#1e8e3e"></rect>
          <rect x="39" y="15" width="12" height="10" rx="2" fill="#1e8e3e"></rect>
          <rect x="4" y="30" width="56" height="6" fill="#1e8e3e"></rect>
          <circle cx="16" cy="50" r="7" fill="#1c2b22"></circle>
          <circle cx="48" cy="50" r="7" fill="#1c2b22"></circle>
          <circle cx="16" cy="50" r="3" fill="#ffffff"></circle>
          <circle cx="48" cy="50" r="3" fill="#ffffff"></circle>
        </svg>
      </div>
      <div class="brand-text">
        <h1 id="stop-name">Mannila 1</h1>
        <p>Tulevat lähdöt</p>
      </div>
    </div>
    <div class="clock-block">
      <div id="clock">--:--:--</div>
      <div id="date">--</div>
    </div>
  </header>
  <main>
    <div id="list"></div>
  </main>
  <footer id="status">Päivitetty --:--:--</footer>
  <div id="debugbar">Diagnostiikka: odotetaan ensimmäistä hakua...</div>
</div>

<script type="text/javascript">
/* ============ ASETUKSET ============ */
var CONFIG = {
  endpoint: "https://api.digitransit.fi/routing/v2/waltti/gtfs/v1",
  apiKey: "880a33a882924bb7aefc9b9f0c66dab4",
  stopId: "LINKKI:143718",
  departures: 6,
  refreshMs: 60000,
  clockMs: 1000,
  timeoutMs: 15000
};
/* ==================================== */

var WEEKDAYS = ["sunnuntai", "maanantai", "tiistai", "keskiviikko", "torstai", "perjantai", "lauantai"];
var attemptCount = 0;

function pad(n) {
  n = parseInt(n, 10);
  if (n < 10) { return "0" + n; }
  return "" + n;
}

function nowClockStr() {
  var d = new Date();
  return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function updateClock() {
  var now = new Date();
  document.getElementById("clock").innerHTML = nowClockStr();
  var dateStr = WEEKDAYS[now.getDay()] + " " + pad(now.getDate()) + "." + pad(now.getMonth() + 1) + "." + now.getFullYear();
  document.getElementById("date").innerHTML = dateStr;
}

function setDebug(text, isError) {
  var bar = document.getElementById("debugbar");
  bar.innerHTML = text;
  bar.className = isError ? "err" : "";
}

function renderMessage(html, isError, detail) {
  var extra = detail ? ('<span class="detail">' + detail + '</span>') : "";
  document.getElementById("list").innerHTML =
    '<div class="msg' + (isError ? ' err' : '') + '">' + html + extra + '</div>';
}

function buildQueryBody() {
  var q = "query Stop($id: String!, $n: Int!) { stop(id: $id) { name stoptimesWithoutPatterns(numberOfDepartures: $n, omitNonPickups: true) { realtime realtimeState serviceDay scheduledDeparture realtimeDeparture headsign trip { route { shortName } } } } }";
  return JSON.stringify({
    query: q,
    variables: { id: CONFIG.stopId, n: CONFIG.departures }
  });
}

function renderDepartures(stop) {
  if (!stop) {
    renderMessage("Pysäkkiä ei löytynyt.", true, "Tarkista stopId: " + CONFIG.stopId);
    return;
  }
  document.getElementById("stop-name").innerHTML = stop.name || "Mannila 1";

  var now = Math.floor(new Date().getTime() / 1000);
  var items = stop.stoptimesWithoutPatterns || [];
  var rows = [];
  var i;

  for (i = 0; i < items.length; i++) {
    var st = items[i];
    var dep = st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture);
    if (dep >= now - 30) {
      rows.push({ st: st, epoch: dep });
    }
  }

  rows.sort(function (a, b) { return a.epoch - b.epoch; });
  rows = rows.slice(0, CONFIG.departures);

  if (rows.length === 0) {
    renderMessage("Ei tulevia lähtöjä juuri nyt.", false);
    return;
  }

  var html = "";
  for (i = 0; i < rows.length; i++) {
    var r = rows[i];
    var s2 = r.st;
    var d = new Date(r.epoch * 1000);
    var clockStr = pad(d.getHours()) + ":" + pad(d.getMinutes());
    var minsLeft = Math.max(0, Math.round((r.epoch - now) / 60));
    var rowClass = (minsLeft <= 2) ? "row soon" : "row";
    var line = "?";
    if (s2.trip && s2.trip.route && s2.trip.route.shortName) {
      line = s2.trip.route.shortName;
    }
    var dest = s2.headsign || "";
    var minsLabel;
    if (minsLeft === 0) {
      minsLabel = "NYT<span class=\"small\">lähtee</span>";
    } else {
      minsLabel = minsLeft + "<span class=\"small\">min</span>";
    }
    html += '<div class="' + rowClass + '">' +
              '<div class="badge">' + line + '</div>' +
              '<div class="dest">' + dest + '<span class="sub">Linja ' + line + '</span></div>' +
              '<div class="clocktime">' + clockStr + '</div>' +
              '<div class="mins">' + minsLabel + '</div>' +
            '</div>';
  }
  document.getElementById("list").innerHTML = html;
}

function loadData() {
  attemptCount = attemptCount + 1;
  var startedAt = new Date().getTime();
  var attemptLabel = "#" + attemptCount + " klo " + nowClockStr();

  if (!CONFIG.apiKey || CONFIG.apiKey.indexOf("SYOTA_") === 0) {
    renderMessage("Digitransit-avain puuttuu.", true, "Lisää CONFIG.apiKey tiedoston alkuun.");
    setDebug(attemptLabel + " -- EI AVAINTA asetettu", true);
    return;
  }

  setDebug(attemptLabel + " -- lähetetään pyyntö osoitteeseen: " + CONFIG.endpoint, false);

  var xhr = new XMLHttpRequest();
  var finished = false;

  try {
    xhr.open("POST", CONFIG.endpoint, true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("digitransit-subscription-key", CONFIG.apiKey);
    xhr.timeout = CONFIG.timeoutMs;
  } catch (openErr) {
    setDebug(attemptLabel + " -- VIRHE pyynnön alustuksessa: " + openErr.toString(), true);
    renderMessage("Selain ei pystynyt alustamaan verkkopyyntöä.", true, openErr.toString());
    return;
  }

  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4 && !finished) {
      finished = true;
      var elapsed = new Date().getTime() - startedAt;

      if (xhr.status === 0) {
        // status 0 readyState 4 = verkko-/CORS-/TLS-virhe, ei koskaan tavoittanut palvelinta kunnolla
        setDebug(attemptLabel + " -- EI YHTEYTTÄ (status 0, " + elapsed + " ms). Syy: TLS/CORS/palomuuri/DNS.", true);
        renderMessage(
          "EI YHTEYTTÄ PALVELIMEEN",
          true,
          "Kohde: " + CONFIG.endpoint + " | HTTP-tila: 0 | Kesto: " + elapsed + " ms | " +
          "Mahdollinen syy: laitteen vanha TLS-tuki, CORS-esitarkistus epäonnistui, tai palomuuri estää yhteyden."
        );
        return;
      }

      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var json = JSON.parse(xhr.responseText);
          if (json.errors && json.errors.length > 0) {
            setDebug(attemptLabel + " -- GraphQL-virhe: " + json.errors[0].message, true);
            renderMessage("Palvelin palautti virheen.", true, json.errors[0].message);
            return;
          }
          renderDepartures(json.data ? json.data.stop : null);
          document.getElementById("status").innerHTML = "Päivitetty " + nowClockStr();
          setDebug(attemptLabel + " -- OK (HTTP 200, " + elapsed + " ms)", false);
        } catch (parseErr) {
          setDebug(attemptLabel + " -- JSON-jäsennysvirhe: " + parseErr.toString(), true);
          renderMessage(
            "Virhe vastauksen käsittelyssä.",
            true,
            "Raaka vastaus (alku): " + xhr.responseText.substring(0, 150)
          );
        }
      } else if (xhr.status === 401 || xhr.status === 403) {
        setDebug(attemptLabel + " -- VÄÄRÄ AVAIN (HTTP " + xhr.status + ")", true);
        renderMessage("API-avain hylätty.", true, "HTTP " + xhr.status + " -- tarkista CONFIG.apiKey.");
      } else {
        setDebug(attemptLabel + " -- HTTP-virhe " + xhr.status + " (" + elapsed + " ms)", true);
        renderMessage(
          "Tietojen haku epäonnistui.",
          true,
          "HTTP " + xhr.status + " " + xhr.statusText + " | Kesto: " + elapsed + " ms"
        );
      }
    }
  };

  xhr.onerror = function () {
    if (finished) { return; }
    finished = true;
    var elapsed = new Date().getTime() - startedAt;
    setDebug(attemptLabel + " -- VERKKOVIRHE (onerror, " + elapsed + " ms)", true);
    renderMessage(
      "VERKKOVIRHE",
      true,
      "Selain ei saanut yhteyttä osoitteeseen " + CONFIG.endpoint + ". " +
      "Tarkista laitteen internet-yhteys ja että osoite ei ole palomuurin/sisältösuodattimen estämä."
    );
  };

  xhr.ontimeout = function () {
    if (finished) { return; }
    finished = true;
    setDebug(attemptLabel + " -- AIKAKATKAISU (" + CONFIG.timeoutMs + " ms sisällä ei vastausta)", true);
    renderMessage(
      "AIKAKATKAISU",
      true,
      "Palvelin ei vastannut " + (CONFIG.timeoutMs / 1000) + " sekunnissa. Yritetään uudelleen automaattisesti."
    );
  };

  try {
    xhr.send(buildQueryBody());
  } catch (sendErr) {
    setDebug(attemptLabel + " -- VIRHE lähetyksessä: " + sendErr.toString(), true);
    renderMessage("Pyynnön lähetys epäonnistui.", true, sendErr.toString());
  }
}

updateClock();
setInterval(updateClock, CONFIG.clockMs);

loadData();
setInterval(loadData, CONFIG.refreshMs);
</script>
</body>
</html>
