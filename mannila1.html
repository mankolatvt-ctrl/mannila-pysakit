<!DOCTYPE html>                                                                                                                                                                                                                                                  
<html lang="fi">                                                                                                                                                                                                                                                 
<head>                                                                                                                                                                                                                                                           
<meta charset="UTF-8">                                                                                                                                                                                                                                           
<meta name="viewport" content="width=device-width, initial-scale=1">                                                                                                                                                                                                     
<title>Mannila 1 – Bussit</title>                                                                                                                                                                                                                               
<style type="text/css">
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #cfe8d6;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Desktop-first: use the actual browser window, not a 1920x1080 canvas. */
  #stage {
    width: 100vw;
    height: 100vh;
    min-width: 1000px;
    min-height: 700px;
    background-color: #eaf6ee;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex: 0 0 clamp(120px, 15vh, 190px);
    background-color: #1e8e3e;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(32px, 4vw, 64px);
    min-width: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    min-width: 0;
  }

  .bus-icon-wrap {
    width: clamp(58px, 5vw, 84px);
    height: clamp(58px, 5vw, 84px);
    margin-right: clamp(16px, 1.5vw, 28px);
    flex-shrink: 0;
  }

  .bus-icon-wrap svg {
    width: 100%;
    height: 100%;
  }

  .brand-text {
    min-width: 0;
  }

  .brand-text h1 {
    margin: 0;
    font-size: clamp(36px, 3.2vw, 56px);
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-text p {
    margin: 4px 0 0 0;
    font-size: clamp(17px, 1.3vw, 22px);
    font-weight: normal;
    color: #d7f0dd;
  }

  .clock-block {
    text-align: right;
    flex-shrink: 0;
    margin-left: 24px;
  }

  #clock {
    font-size: clamp(42px, 3.4vw, 60px);
    font-weight: bold;
    line-height: 1;
  }

  #date {
    margin-top: 6px;
    font-size: clamp(16px, 1.2vw, 20px);
    color: #d7f0dd;
  }

  main {
    flex: 1 1 auto;
    min-height: 0;
    padding: clamp(20px, 3.5vh, 36px) clamp(32px, 4vw, 64px) clamp(14px, 2.5vh, 24px);
    display: flex;
    flex-direction: column;
  }

  #list {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(9px, 1.45vh, 16px);
  }

  .row {
    flex: 1 1 0;
    min-height: 0;
    min-width: 0;
    margin-bottom: 0;
    background-color: #ffffff;
    border-radius: clamp(12px, 1.05vw, 20px);
    padding: 0 clamp(20px, 2.1vw, 40px);
    display: grid;
    grid-template-columns:
      clamp(70px, 6.8vw, 110px)
      minmax(0, 1fr)
      clamp(120px, 10vw, 170px)
      clamp(135px, 11.5vw, 190px);
    align-items: center;
    gap: clamp(14px, 1.5vw, 28px);
  }

  .badge {
    width: clamp(56px, 4.8vw, 92px);
    height: clamp(56px, 4.8vw, 92px);
    border-radius: 50%;
    background-color: #1e8e3e;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(24px, 1.7vw, 32px);
    font-weight: bold;
    margin-right: 0;
    flex-shrink: 0;
  }

  .row.soon .badge { background-color: #e2622a; }

  .dest {
    min-width: 0;
    font-size: clamp(24px, 2.15vw, 40px);
    font-weight: bold;
    color: #1c2b22;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-right: 0;
  }

  .dest .sub {
    display: block;
    font-size: clamp(14px, 1.05vw, 20px);
    font-weight: normal;
    color: #6b7d72;
    margin-top: 4px;
  }

  .clocktime {
    width: auto;
    min-width: 0;
    text-align: right;
    font-size: clamp(22px, 1.75vw, 34px);
    color: #6b7d72;
    margin-right: 0;
    flex-shrink: 0;
  }

  .mins {
    width: auto;
    min-width: 0;
    text-align: center;
    background-color: #e6f4ea;
    color: #146c2e;
    border-radius: clamp(10px, 0.85vw, 16px);
    padding: clamp(9px, 1.05vh, 12px) clamp(10px, 1vw, 18px);
    font-size: clamp(28px, 2.1vw, 40px);
    font-weight: bold;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .mins .small {
    display: block;
    font-size: clamp(12px, 0.85vw, 16px);
    font-weight: normal;
    color: #1e8e3e;
    margin-top: 4px;
  }

  .row.soon .mins { background-color: #fbe6dc; color: #e2622a; }
  .row.soon .mins .small { color: #e2622a; }

  footer {
    flex: 0 0 clamp(34px, 5vh, 50px);
    height: auto;
    text-align: center;
    color: #6b7d72;
    font-size: clamp(13px, 1vw, 18px);
    padding-top: 8px;
  }

  .msg {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #6b7d72;
    font-size: clamp(20px, 1.7vw, 30px);
    padding: 40px 8vw;
  }

  /* 1345x979 ja muut pienemmät työpöydät */
  @media (max-width: 1500px) {
    .row {
      grid-template-columns: 68px minmax(0, 1fr) 125px 150px;
      gap: 16px;
      padding-left: 22px;
      padding-right: 22px;
    }

    .badge {
      width: 58px;
      height: 58px;
    }
  }

  /* Jos työpöydän korkeus on pieni, säästetään pystysuunnassa. */
  @media (max-height: 850px) {
    header { flex-basis: 112px; }

    main {
      padding-top: 16px;
      padding-bottom: 10px;
    }

    #list { gap: 8px; }

    footer { flex-basis: 32px; }
  }
</style>                                                                                                                                                                                                                                                         
</head>                                                                                                                                                                                                                                                          
<body>                                                                                                                                                                                                                                                           
<div id="stage">                                                                                                                                                                                                                                                 
  <header>                                                                                                                                                                                                                                                       
    <div class="brand">                                                                                                                                                                                                                                          
      <div class="bus-icon-wrap">                                                                                                                                                                                                                                
        <svg width="84" height="84" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">                                                                                                                                                                    
          <rect x="4" y="10" width="56" height="34" rx="8" fill="#ffffff"></rect>                                                                                                                                                                               
          <rect x="9" y="15" width="12" height="10" rx="2" fill="#1e8e3e"></rect>                                                                                                                                                                               
          <rect x="24" y="15" width="12" height="10" rx="2" fill="#1e8e3e"></rect>                                                                                                                                                                              
          <rect x="39" y="15" width="12" height="10" rx="2" fill="#1e8e3e"></rect>                                                                                                                                                                              
          <rect x="4" y="30" width="56" height="6" fill="#1e8e3e"></rect>                                                                                                                                                                                       
          <circle cx="16" cy="50" r="7" fill="#1c2b22"></circle>                                                                                                                                                                                                
          <circle cx="48" cy="50" r="7" fill="#1c2b22"></circle>                                                                                                                                                                                                
          <circle cx="16" cy="50" r="3" fill="#ffffff"></circle>                                                                                                                                                                                                
          <circle cx="48" cy="50" r="3" fill="#ffffff"></circle>                                                                                                                                                                                                
        </svg>                                                                                                                                                                                                                                                   
      </div>                                                                                                                                                                                                                                                     
      <div class="brand-text">                                                                                                                                                                                                                                   
        <h1 id="stop-name">Mannila 1</h1>                                                                                                                                                                                                                       
        <p>Tulevat lähdöt</p>                                                                                                                                                                                                                                   
      </div>                                                                                                                                                                                                                                                     
    </div>                                                                                                                                                                                                                                                       
    <div class="clock-block">                                                                                                                                                                                                                                    
      <div id="clock">--:--:--</div>                                                                                                                                                                                                                            
      <div id="date">--</div>                                                                                                                                                                                                                                   
    </div>                                                                                                                                                                                                                                                       
  </header>                                                                                                                                                                                                                                                      
  <main>                                                                                                                                                                                                                                                         
    <div id="list"></div>                                                                                                                                                                                                                                       
  </main>                                                                                                                                                                                                                                                        
  <footer id="status">Päivitetty --:--:--</footer>                                                                                                                                                                                                              
</div>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
<script type="text/javascript">                                                                                                                                                                                                                                  
/* ============ ASETUKSET ============ */                                                                                                                                                                                                                       
var CONFIG = {                                                                                                                                                                                                                                                    
  endpoint: "https://api.digitransit.fi/routing/v2/waltti/gtfs/v1",                                                                                                                                                                                              
  apiKey: "880a33a882924bb7aefc9b9f0c66dab4",                                                                                                                                                                                                                     
  stopId: "LINKKI:143718",                                                                                                                                                                                                                                        
  departures: 6,                                                                                                                                                                                                                                                  
  refreshMs: 60000,                                                                                                                                                                                                                                               
  clockMs: 1000                                                                                                                                                                                                                                                   
};                                                                                                                                                                                                                                                                
/* ==================================== */                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
var WEEKDAYS = ["sunnuntai", "maanantai", "tiistai", "keskiviikko", "torstai", "perjantai", "lauantai"];                                                                                                                                                                                                                                                                                                                                                                                                                        
function pad(n) {                                                                                                                                                                                                                                                 
  n = parseInt(n, 10);                                                                                                                                                                                                                                            
  if (n < 10) { return "0" + n; }                                                                                                                                                                                                                                 
  return "" + n;                                                                                                                                                                                                                                                  
}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
function updateClock() {                                                                                                                                                                                                                                          
  var now = new Date();                                                                                                                                                                                                                                           
  var h = pad(now.getHours());                                                                                                                                                                                                                                   
  var m = pad(now.getMinutes());                                                                                                                                                                                                                                 
  var s = pad(now.getSeconds());                                                                                                                                                                                                                                 
  document.getElementById("clock").innerHTML = h + ":" + m + ":" + s;                                                                                                                                                                                             
  var dateStr = WEEKDAYS[now.getDay()] + " " + pad(now.getDate()) + "." + pad(now.getMonth() + 1) + "." + now.getFullYear();                                                                                                                                  
  document.getElementById("date").innerHTML = dateStr;                                                                                                                                                                                                            
}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
function renderMessage(html) {                                                                                                                                                                                                                                    
  document.getElementById("list").innerHTML = '<div class="msg">' + html + '</div>';                                                                                                                                                                            
}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
function buildQueryBody() {                                                                                                                                                                                                                                       
  var q = "query Stop($id: String!, $n: Int!) { stop(id: $id) { name stoptimesWithoutPatterns(numberOfDepartures: $n, omitNonPickups: true) { realtime realtimeState serviceDay scheduledDeparture realtimeDeparture headsign trip { route { shortName } } } } }";
  return JSON.stringify({                                                                                                                                                                                                                                         
    query: q,                                                                                                                                                                                                                                                     
    variables: { id: CONFIG.stopId, n: CONFIG.departures }                                                                                                                                                                                                        
  });                                                                                                                                                                                                                                                             
}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
function renderDepartures(stop) {                                                                                                                                                                                                                                 
  if (!stop) {                                                                                                                                                                                                                                                    
    renderMessage("Pysäkkiä ei löytynyt.<br>Tarkista stopId asetuksista.");                                                                                                                                                                                      
    return;                                                                                                                                                                                                                                                       
  }                                                                                                                                                                                                                                                               
  document.getElementById("stop-name").innerHTML = stop.name || "Mannila 1";                                                                                                                                                                                                                                                                                                                                                                                                                                                  
  var now = Math.floor(new Date().getTime() / 1000);                                                                                                                                                                                                              
  var items = stop.stoptimesWithoutPatterns || [];                                                                                                                                                                                                              
  var rows = [];                                                                                                                                                                                                                                                  
  var i;                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
  for (i = 0; i < items.length; i++) {                                                                                                                                                                                                                            
    var st = items[i];                                                                                                                                                                                                                                            
    var dep = st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture);                                                                                                                                                                       
    if (dep >= now - 30) {                                                                                                                                                                                                                                        
      rows.push({ st: st, epoch: dep });                                                                                                                                                                                                                          
    }                                                                                                                                                                                                                                                             
  }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             
  rows.sort(function (a, b) { return a.epoch - b.epoch; });                                                                                                                                                                                                       
  rows = rows.slice(0, CONFIG.departures);                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
  if (rows.length === 0) {                                                                                                                                                                                                                                        
    renderMessage("Ei tulevia lähtöjä juuri nyt.");                                                                                                                                                                                                               
    return;                                                                                                                                                                                                                                                       
  }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             
  var html = "";                                                                                                                                                                                                                                                  
  for (i = 0; i < rows.length; i++) {                                                                                                                                                                                                                             
    var r = rows[i];                                                                                                                                                                                                                                              
    var s2 = r.st;                                                                                                                                                                                                                                                
    var d = new Date(r.epoch * 1000);                                                                                                                                                                                                                            
    var clockStr = pad(d.getHours()) + ":" + pad(d.getMinutes());                                                                                                                                                                                                 
    var minsLeft = Math.max(0, Math.round((r.epoch - now) / 60));                                                                                                                                                                                                 
    var rowClass = (minsLeft <= 2) ? "row soon" : "row";                                                                                                                                                                                                          
    var line = "?";                                                                                                                                                                                                                                               
    if (s2.trip && s2.trip.route && s2.trip.route.shortName) {                                                                                                                                                                                                    
      line = s2.trip.route.shortName;                                                                                                                                                                                                                             
    }                                                                                                                                                                                                                                                             
    var dest = s2.headsign || "";                                                                                                                                                                                                                               
    var minsLabel;                                                                                                                                                                                                                                                
    if (minsLeft === 0) {                                                                                                                                                                                                                                         
      minsLabel = "NYT<span class=\"small\">lähtee</span>";                                                                                                                                                                                                   
    } else {                                                                                                                                                                                                                                                      
      minsLabel = minsLeft + "<span class=\"small\">min</span>";                                                                                                                                                                                              
    }                                                                                                                                                                                                                                                             
    html += '<div class="' + rowClass + '">' +                                                                                                                                                                                                                   
              '<div class="badge">' + line + '</div>' +                                                                                                                                                                                                         
              '<div class="dest">' + dest + '<span class="sub">Linja ' + line + '</span></div>' +                                                                                                                                                             
              '<div class="clocktime">' + clockStr + '</div>' +                                                                                                                                                                                                 
              '<div class="mins">' + minsLabel + '</div>' +                                                                                                                                                                                                     
            '</div>';                                                                                                                                                                                                                                            
  }                                                                                                                                                                                                                                                               
  document.getElementById("list").innerHTML = html;                                                                                                                                                                                                               
}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
function loadData() {                                                                                                                                                                                                                                             
  if (!CONFIG.apiKey || CONFIG.apiKey.indexOf("SYOTA_") === 0) {                                                                                                                                                                                               
    renderMessage("Digitransit-avain puuttuu.<br>Lisää se CONFIG.apiKey-kohtaan tiedoston alussa.");                                                                                                                                                             
    return;                                                                                                                                                                                                                                                       
  }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             
  var xhr = new XMLHttpRequest();                                                                                                                                                                                                                                 
  try {                                                                                                                                                                                                                                                           
    xhr.open("POST", CONFIG.endpoint, true);                                                                                                                                                                                                                      
    xhr.setRequestHeader("Content-Type", "application/json");                                                                                                                                                                                                     
    xhr.setRequestHeader("digitransit-subscription-key", CONFIG.apiKey);                                                                                                                                                                                          
  } catch (e) {                                                                                                                                                                                                                                                   
    renderMessage("Selain ei tukenut pyynnön alustusta: " + e.toString());                                                                                                                                                                                        
    return;                                                                                                                                                                                                                                                       
  }                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             
  xhr.onreadystatechange = function () {                                                                                                                                                                                                                          
    if (xhr.readyState === 4) {                                                                                                                                                                                                                                   
      if (xhr.status >= 200 && xhr.status < 300) {                                                                                                                                                                                                                
        try {                                                                                                                                                                                                                                                     
          var json = JSON.parse(xhr.responseText);                                                                                                                                                                                                                
          if (json.errors && json.errors.length > 0) {                                                                                                                                                                                                            
            renderMessage("Haku epäonnistui: " + json.errors[0].message);                                                                                                                                                                                         
            return;                                                                                                                                                                                                                                               
          }                                                                                                                                                                                                                                                       
          renderDepartures(json.data ? json.data.stop : null);                                                                                                                                                                                                    
          document.getElementById("status").innerHTML = "Päivitetty " + document.getElementById("clock").innerHTML;                                                                                                                                               
        } catch (parseErr) {                                                                                                                                                                                                                                      
          renderMessage("Virhe vastauksen käsittelyssä.");                                                                                                                                                                                                        
        }                                                                                                                                                                                                                                                         
      } else {                                                                                                                                                                                                                                                    
        renderMessage("Tietojen haku epäonnistui (HTTP " + xhr.status + ").<br>Yritetään uudelleen automaattisesti.");                                                                                                                                           
        document.getElementById("status").innerHTML = "Virhe haussa";                                                                                                                                                                                             
      }                                                                                                                                                                                                                                                           
    }                                                                                                                                                                                                                                                             
  };                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
  xhr.send(buildQueryBody());                                                                                                                                                                                                                                     
}                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
updateClock();                                                                                                                                                                                                                                                    
setInterval(updateClock, CONFIG.clockMs);                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
loadData();                                                                                                                                                                                                                                                       
setInterval(loadData, CONFIG.refreshMs);                                                                                                                                                                                                                          
</script>                                                                                                                                                                                                                                                        
</body>                                                                                                                                                                                                                                                          
</html>
